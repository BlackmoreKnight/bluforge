name: Release

# Build and publish a release whenever a version tag (vX.Y[.Z]) is pushed.
#
#   git tag v1.2
#   git push origin v1.2
#
# Uses the built-in GITHUB_TOKEN, so no personal access token is required.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build addon zip (runtime files only)
        run: |
          mkdir -p dist/bluforge/data
          cp bluforge.lua blu.lua ui.lua dist/bluforge/
          cp data/bludata.lua data/spells.json dist/bluforge/data/
          (cd dist && zip -r "../bluforge-${GITHUB_REF_NAME}.zip" bluforge)
          echo "--- archive contents ---"
          unzip -l "bluforge-${GITHUB_REF_NAME}.zip"

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "bluforge-${GITHUB_REF_NAME}.zip" \
            --title "BluForge ${GITHUB_REF_NAME}" \
            --generate-notes
